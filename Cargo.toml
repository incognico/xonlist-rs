[package]
name = "xonlist"
version = "0.1.0"
edition = "2021"
description = "Xonotic gameserver list"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
askama = "0.14"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
image = "0.25"
imageproc = "0.25"
maxminddb = "0.26"
mime_guess = "2"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "charset"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
